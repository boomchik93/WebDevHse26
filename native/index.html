<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в личный кабинет</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>Верхняя часть страницы</header>
    <main>
        <section class="card outline">
            <h2 class="card-header">Вход</h2>
            <div class="social">
                <button type="button">По номеру телефона</button>
                <button type="button">Через ЛК ВШЭ</button>
            </div>
            <form>
                <label>Почта <input type="email" name="email"></label>
                <label>Пароль <input type="password" name="password"></label>
                <label><input type="checkbox" name="remember"> Запомнить меня</label>
                <button type="submit">Войти</button>
            </form>
        </section>
    </main>
    <footer>Нижняя часть страницы</footer>
</body>
</html>
